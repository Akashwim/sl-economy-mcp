# Calls every tool against the real CBSL and Ministry of Finance websites.
# Started by hand from the Actions tab. It no longer runs every weekday: since
# 13 October 2026 CBSL refuses GitHub's servers (HTTP 403), so the daily run
# could not test CBSL's pages and failed every day, which hid real failures.
# Run checks/live_check.py from an ordinary connection before each release.
name: live check

on:
  workflow_dispatch:

jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install .
      - run: python checks/live_check.py
