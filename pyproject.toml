[project]
name = "sl-economy-mcp"
version = "0.1.0"
description = "Unofficial MCP server for live, official Sri Lankan economic data from the Central Bank of Sri Lanka and the Ministry of Finance."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Akash Wimalananda" }]
keywords = ["mcp", "sri-lanka", "economics", "central-bank", "cbsl", "exchange-rates", "inflation", "treasury-bills"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp>=2,<3",
    "xlrd>=2,<3",
    "pypdf>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Akashwim/sl-economy-mcp"
Issues = "https://github.com/Akashwim/sl-economy-mcp/issues"
Changelog = "https://github.com/Akashwim/sl-economy-mcp/blob/main/CHANGELOG.md"

[project.scripts]
sl-economy-mcp = "sl_economy_mcp.server:main"
sl-economy-sheet = "sl_economy_mcp.morning_rates:save_csv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "checks", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
